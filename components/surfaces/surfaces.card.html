<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--surface-canvas)}#root{padding:20px 22px;box-sizing:border-box}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-label)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../_dev/ds-ready.js" data-base="../.."></script>
<script type="text/babel">
window.vvReady().then(() => {
const { GradientField, VideoBackdrop, Bezel, Sheet, Eyebrow } = window.VivumAIDesignSystem_b2be15;
function Card() {
  return (
    <div className="col" style={{ gap: 14 }}>
      <VideoBackdrop scrim="bottom" minHeight={150} pad="18px 20px">
        <Bezel pad="16px 20px" chamfer={22} accent={false}>
          <Eyebrow size="sm">Evolutionary AI</Eyebrow>
          <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: '-0.03em', color: 'var(--vv-ice)', marginTop: 8 }}>
            Autonomy where the cloud can't reach
          </div>
        </Bezel>
      </VideoBackdrop>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
        {['signature', 'aperture', 'ember', 'well'].map((fld) => (
          <div key={fld} className="col" style={{ gap: 7 }}>
            <GradientField field={fld} minHeight={58} style={{ border: '1px solid var(--line-hairline)' }} />
            <span className="lbl">{fld}</span>
          </div>
        ))}
      </div>
      <Sheet pad={16} maxWidth="100%">
        <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--text-heading-on-light)', letterSpacing: '-0.01em' }}>Ice sheet — print and light UI</div>
        <div style={{ fontSize: 12.5, marginTop: 5 }}>Deep Navy headings, Slate body, Graphite captions.</div>
      </Sheet>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script>
</body></html>
