<!-- @dsCard group="Components" viewport="700x330" name="Data" subtitle="Stats, hairline table, ratio bar, status dots" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--surface-canvas)}#root{padding:20px 22px;box-sizing:border-box}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-label)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../_dev/ds-ready.js" data-base="../.."></script>
<script type="text/babel">
window.vvReady().then(() => {
const { Stat, DataTable, RatioBar, StatusDot, Divider } = window.VivumAIDesignSystem_b2be15;
function Card() {
  const rows = [
    { id: 1, unit: 'vv-edge-041', site: 'Mojave', lat: '4.2 ms', state: <StatusDot tone="live" pulse>Streaming</StatusDot> },
    { id: 2, unit: 'vv-edge-042', site: 'Mojave', lat: '4.6 ms', state: <StatusDot tone="attention">Degraded link</StatusDot> },
    { id: 3, unit: 'vv-air-007', site: 'Kern', lat: '5.1 ms', state: <StatusDot tone="idle">Dormant</StatusDot> },
  ];
  return (
    <div className="col" style={{ gap: 18 }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 20 }}>
        <Stat value="4.2" unit="ms" label="Inference" delta="-31% vs. baseline" />
        <Stat value="118" label="Units live" />
        <Stat value="11.4" unit="W" label="Draw at peak" deltaTone="amber" delta="+4%" />
        <Stat value="99.98" unit="%" label="Uptime" mono />
      </div>
      <Divider />
      <DataTable dense columns={[
        { key: 'unit', label: 'Unit', mono: true },
        { key: 'site', label: 'Site', tone: 'muted' },
        { key: 'lat', label: 'Latency', mono: true, align: 'right', tone: 'data' },
        { key: 'state', label: 'State' },
      ]} rows={rows} />
      <RatioBar segments={[
        { label: 'On-device', value: 62, color: 'var(--vv-blue)' },
        { label: 'Edge relay', value: 26, color: 'var(--vv-slate)' },
        { label: 'Cloud', value: 12, color: 'var(--vv-amber)' },
      ]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script>
</body></html>
