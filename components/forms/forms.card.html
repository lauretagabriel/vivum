<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--surface-canvas)}#root{padding:20px 22px;box-sizing:border-box}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-label)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../_dev/ds-ready.js" data-base="../.."></script>
<script type="text/babel">
window.vvReady().then(() => {
const { Input, Select, Checkbox, Switch, Divider } = window.VivumAIDesignSystem_b2be15;
function Card() {
  return (
    <div className="col">
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        <Input label="Fleet ID" placeholder="vv-fleet-000" icon="search" />
        <Select label="Deployment target" options={['Air', 'Land', 'Sea', 'Space', 'Edge']} defaultValue="Edge" />
        <Input label="Endpoint" defaultValue="edge-04.vivum.ai" error="Unreachable from this region" />
        <Input label="Operator" defaultValue="Disabled field" disabled />
      </div>
      <Divider spacing={2} />
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, alignItems: 'start' }}>
        <div className="col" style={{ gap: 12 }}>
          <Checkbox label="Stream telemetry to ground" hint="Adds 40 kbps uplink" defaultChecked />
          <Checkbox label="Retain raw sensor frames" />
        </div>
        <div className="col" style={{ gap: 14 }}>
          <Switch label="Autonomous fallback" hint="Run on-device when the link drops" defaultChecked />
          <Switch label="Shadow mode" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
});
</script>
