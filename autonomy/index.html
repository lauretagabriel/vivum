<!-- __VV_BASE is how every built URL on this page is addressed: '' at the site root, '../'
     one folder down. Set before any script that resolves an asset path or a route. -->
<script>window.__VV_BASE = '../';</script>
<style>html,body{margin:0;background:#001121;overflow-x:clip}#root{min-height:100vh}</style>
<style>/* Boot cover. Inline, hardcoded hex, zero dependencies: it must paint on the FIRST frame,
     before styles.css, React, Babel or a single plate has arrived. Preloader.jsx adopts this
     same DOM once it exists rather than drawing a second cover of its own. */
#vv-boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:#001121;padding:24px;transition:opacity 700ms cubic-bezier(.16,1,.3,1),transform 700ms cubic-bezier(.16,1,.3,1)}
#vv-boot.out{opacity:0;transform:scale(1.03);pointer-events:none}
html:has(#vv-boot){overflow:hidden}
#vv-boot .box{position:relative;width:min(340px,78vw);display:flex;flex-direction:column;gap:clamp(28px,6vw,40px)}
#vv-boot .box>i{position:absolute;width:13px;height:13px;border:0 solid #EC9A00;opacity:.5}
#vv-boot .tl{top:-18px;left:-18px;border-top-width:1px;border-left-width:1px}
#vv-boot .tr{top:-18px;right:-18px;border-top-width:1px;border-right-width:1px}
#vv-boot .bl{bottom:-18px;left:-18px;border-bottom-width:1px;border-left-width:1px}
#vv-boot .br{bottom:-18px;right:-18px;border-bottom-width:1px;border-right-width:1px}
#vv-boot img{height:60px;width:auto;display:block;margin:0 auto;opacity:.92}
#vv-boot .meter{display:flex;flex-direction:column;gap:12px}
#vv-boot .rail{position:relative;height:2px;background:rgba(218,232,242,.14);overflow:hidden}
#vv-boot .fill{position:absolute;left:0;top:0;bottom:0;width:2%;background:#EC9A00;transition:width 180ms linear}
#vv-boot .scan{position:absolute;top:0;bottom:0;left:0;width:26%;background:linear-gradient(90deg,rgba(236,154,0,0) 0%,rgba(236,154,0,.55) 55%,rgba(236,154,0,0) 100%);animation:vvBootScan 2200ms cubic-bezier(.16,1,.3,1) infinite}
#vv-boot .read{display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
#vv-boot .label{color:rgba(218,232,242,.56);animation:vvBootPulse 1800ms ease-in-out infinite}
#vv-boot .pct{color:#EC9A00;font-variant-numeric:tabular-nums}
@keyframes vvBootScan{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}
@keyframes vvBootPulse{0%,100%{opacity:.34}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#vv-boot *{animation:none!important}#vv-boot.out{transform:none}}</style></head>
<body><div id="vv-boot" role="status" aria-live="polite" aria-label="Loading">
<div class="box"><i class="tl" aria-hidden="true"></i><i class="tr" aria-hidden="true"></i><i class="bl" aria-hidden="true"></i><i class="br" aria-hidden="true"></i>
<img src="../images/vivum-logo-gray.svg" alt="Vivum AI">
<div class="meter"><div class="rail"><span class="fill" data-fill=""></span><span class="scan" aria-hidden="true"></span></div>
<div class="read"><span class="label" data-label="">Loading data</span><span class="pct" data-pct="">00%</span></div></div></div></div>
<script>
/* The cover's own progress, for the stage no React component can report on: everything that
   has to arrive BEFORE the app exists (React, ReactDOM, Babel, the design-system bundle, and
   the JSX sources Babel compiles at runtime). Read from resource timing rather than guessed
   at, and it owns only the first third of the rail. Preloader.jsx then maps real asset
   acquisition into the rest, so the two stages are ONE bar that never restarts.

   Dependency-free ES5 in an inline script: it runs before the first external byte lands. */
(function () {
  var el = document.getElementById('vv-boot');
  if (!el) return;
  var fill = el.querySelector('[data-fill]'), pct = el.querySelector('[data-pct]'), label = el.querySelector('[data-label]');
  var BASE = 0.34, t0 = Date.now(), target = 0, shown = 0, gone = false;
  var HEAVY = [['react.development', 10], ['react-dom.development', 12], ['babel.min', 26], ['_ds_bundle.js', 10], ['styles.css', 2]];
  var JSX_W = 1.2, JSX_N = 13, TOTAL = 60 + JSX_W * JSX_N;
  function paint() {
    var v = Math.round(shown * 100);
    fill.style.width = Math.max(2, v) + '%';
    pct.textContent = (v < 10 ? '0' : '') + v + '%';
  }
  function scan() {
    var e, i, j, n, seen = {}, got = 0, jsx = 0;
    if (!window.performance || !performance.getEntriesByType) return -1;
    e = performance.getEntriesByType('resource');
    for (i = 0; i < e.length; i++) {
      if (!e[i].responseEnd) continue;
      n = e[i].name;
      for (j = 0; j < HEAVY.length; j++) if (!seen[j] && n.indexOf(HEAVY[j][0]) > -1) { seen[j] = 1; got += HEAVY[j][1]; }
      if (/\.jsx($|\?)/.test(n)) jsx++;
    }
    return (got + Math.min(jsx, JSX_N) * JSX_W) / TOTAL;
  }
  var poll = setInterval(function () {
    if (gone) return;
    var f = scan(), age = Date.now() - t0;
    /* A self-contained build fetches nothing, so there is no timing entry to read and no
       honest figure to show. Past a beat of silence the rail runs an indeterminate creep
       instead of sitting at 00% — the one state a loading screen must never hold. */
    if (f <= 0 && age > 400) f = 1 - Math.exp(-(age - 400) / 1400);
    if (f > 0) target = Math.max(target, Math.min(1, f) * BASE);
  }, 120);
  var ease = setInterval(function () {
    if (gone) return;
    shown += (target - shown) * 0.14;
    if (target - shown < 0.004) shown = target;
    paint();
  }, 40);
  window.__vvBoot = {
    t0: t0,
    base: BASE,
    /* frac is progress on the WHOLE rail — stage two maps its own 0..1 into base..1. */
    set: function (frac, text) {
      if (gone) return;
      clearInterval(poll);
      target = Math.max(target, Math.min(1, frac));
      if (text && label.textContent !== text) label.textContent = text;
    },
    exit: function () {
      if (gone) return;
      gone = true;
      clearInterval(poll);
      clearInterval(ease);
      shown = 1;
      paint();
      el.className = 'out';
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 760);
    }
  };
  /* Nothing may leave the page covered forever — a script that failed to parse, a blocked CDN,
     an editor reload that skipped the boot screen. The cover lifts on its own regardless. */
  setTimeout(function () { window.__vvBoot.exit(); }, 20000);
})();
/* This page's own plate set, read by Preloader.jsx when it runs — the rail is weighted by
   real bytes, so each page waits only on the footage it actually paints. */
window.__vvBootAssets = [
  { kind: 'image', src: '../images/vivum-logo-gray.svg', w: 1 },
  { kind: 'video', src: '../videos/dynamic-neural-models-v4.mp4', w: 10 },
  { kind: 'video', src: '../videos/dynamic-neural-models-v3.mp4', w: 7 },
];
</script>

</script>
